<svg width="100%" height="210" viewBox="0 0 800 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyber Gradient Background -->
    <linearGradient id="cyberBg" x1="0" y1="0" x2="800" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140F0A"/>
      <stop offset="60%" stop-color="#0D0A07"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    
    <!-- Copper Glow Line -->
    <linearGradient id="copperLine" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E58A2B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Base Card Frame -->
  <rect x="0" y="0" width="800" height="210" rx="10" fill="url(#cyberBg)"/>
  <rect x="1" y="1" width="798" height="208" rx="9" fill="none" stroke="#2D1C0F" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#copperLine)"/>

  <!-- Background Hex/Data Stream (Low Opacity Cyber Grid) -->
  <g opacity="0.07" fill="#E58A2B" font-family="'Courier New', monospace" font-size="11">
    <text x="500" y="40">0x7F 0x45 0x4C 0x46 0x02 0x01</text>
    <text x="500" y="60">AES-256-GCM [AUTHENTICATED]</text>
    <text x="500" y="80">PORT 443 [OPEN] // TLS v1.3</text>
    <text x="500" y="100">SHA256: e3b0c44298fc1c149afbf4</text>
    <text x="500" y="120">DEFENSE IN DEPTH :: ACTIVE</text>
    <text x="500" y="140">01000011 01011001 01000010</text>
    <text x="500" y="160">MEM_DUMP :: ARTIFACT_ANALYSIS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="40" y="65" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" letter-spacing="0.5">Nabiha Majid</text>
  
  <text x="40" y="98" fill="#E58A2B" font-family="'Courier New', monospace" font-weight="700" font-size="16">&gt; Digital Forensics &amp; Cybersecurity Researcher</text>

  <!-- Core Security Competencies -->
  <text x="40" y="138" fill="#C2A488" font-family="'Segoe UI', sans-serif" font-size="14">Specializing in Applied Cryptography, Protocol Analysis, Threat Hunting &amp; SOC Operations.</text>
  <text x="40" y="162" fill="#8C6F56" font-family="'Segoe UI', sans-serif" font-size="13">Undergraduate @ Hamdard University • Karachi, PK</text>

  <!-- Shield Graphic (Right Side) -->
  <g transform="translate(710, 85)" opacity="0.85">
    <path d="M 0 -30 L 30 -15 V 10 C 30 30 0 45 0 45 C 0 45 -30 30 -30 10 V -15 L 0 -30 Z" fill="#1A110A" stroke="#E58A2B" stroke-width="2"/>
    <path d="M 0 -20 L 20 -10 V 8 C 20 22 0 32 0 32 C 0 32 -20 22 -20 8 V -10 L 0 -20 Z" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Lock Shackle & Body -->
    <rect x="-6" y="2" width="12" height="10" rx="2" fill="#E58A2B"/>
    <path d="M -4 2 V -2 C -4 -5 0 -6 0 -6 C 0 -6 4 -5 4 -2 V 2" fill="none" stroke="#E58A2B" stroke-width="1.8"/>
  </g>
</svg>
